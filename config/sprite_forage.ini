# Sprite Forage: same 20x15 game in both observation modes.
[base]
env_name = sprite_forage
async = 0

[env]
# 0 = state; 1 = 640x480 RGB pixels, with a Nature CNN.
observation_mode = 0
# Attention research build only: 0 = full board; 1 = local + chosen gaze.
partial_observation = 0
# State only: 0 = row-ordered coordinates, 1 = scalar grid/player=1,
# 2 = row-ordered coordinates and a 5x5 local grid.
state_layout = 2
# World RNG offset, added to the native environment slot. Never sweep seeds.
seed = 0
copies_per_type = 3
trees = 8
max_steps = 512
step_cost = -0.001
# Reward scales can vary; perf always clamps (apples + grape - bad) / 4.
reward_good = 1.0
reward_grape = 1.0
reward_other = 0.0
reward_bad = -0.5
reward_death = -1.0
representation = 0

[vec]
total_agents = 16
num_buffers = 1
num_threads = 2

[policy]
hidden_size = 128
num_layers = 1

# Starting learner only; not tuned or learning-qualified.
[train]
gpus = 1
total_timesteps = 2097152
learning_rate = 0.001
horizon = 16
minibatch_size = 16

[sweep]
metric = perf

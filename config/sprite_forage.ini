# Sprite Forage: same 20x15 game in both observation modes.
[base]
env_name = sprite_forage
async = 0
seed = 7
checkpoint_interval = 128
eval_episodes = 0

[env]
# 0 = object/state observations; 1 = RGB pixels.
# With full observations, pixels are 640x480 and use Nature by default.
observation_mode = 0
# Attention research build only; the normal binary ignores this setting.
# 0 = full observations: state uses state_layout; pixels show the whole board.
# 1 = partial observations: 8 player neighbors + an agent-chosen 3x3 gaze.
# Both state and pixels get the same cells, gaze actions and position metadata.
# Partial state uses tile IDs or one-hot identities, chosen when building.
# Partial pixels use the shared tile CNN. Gaze-only builds omit player neighbors.
# Build options and input/action sizes: research/FORAGE_ATTENTION.md.
partial_observation = 0
# Full state only; ignored for pixels and partial observations:
# 0 = player X/Y + per-type object coordinates in board row order.
# 1 = one scalar code per board cell, with the player marked as 1.
# 2 = layout 0 plus a player-centered 5x5 scalar grid (141 values at defaults).
# Layout 2 is the strong state reference; CNN candidates compete on pixels.
# Match visibility, actions and learner settings when comparing CNN architectures.
state_layout = 2
# World RNG offset, added to the native environment slot. Never sweep seeds.
seed = 0
copies_per_type = 3
trees = 8
max_steps = 676
step_cost = -0.001
# Reward scales can vary; perf always clamps (apples + grape - bad) / 4.
reward_good = 1.0
reward_grape = 3.71950364
reward_other = 0.0
reward_bad = -1.68730032
reward_death = -0.5
# Appearance only; game rules and world RNG stay the same.
# 0 = original sprites; 1 = swapped palette; 2 = mirrored sprites;
# 3 = denser grass texture; 4 = imported sprites.
representation = 0

[vec]
# State-tuned batch; full-resolution pixels need smaller batches (see README).
total_agents = 256
num_buffers = 1
num_threads = 4

[policy]
hidden_size = 128
num_layers = 1

# Tuned state recipe: research/results/sprite-forage-cleanup-sps-5060-20261015/.
[train]
gpus = 1
total_timesteps = 8388608
learning_rate = 0.0141914776
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.998099923
gae_lambda = 0.850000024
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.00611945381
anneal_ent_coef = 0
momentum = 0.95
horizon = 64
minibatch_size = 2048
vtrace = 0
verb_eps = 0.0

[sweep]
metric = perf

# Sprite Lane Dodge: 20x15 road, 10 adjacent lanes (columns 5-14) with
# dashed edge stripes, in four observation modes.
[base]
env_name = sprite_lanedodge
async = 0
seed = 7
checkpoint_interval = 128
eval_episodes = 0

[env]
# 0 = state (21 floats: lane, per-lane hazard/coin distances);
# 1 = 640x480 RGB pixels, with a Nature CNN;
# 2 = agent ROI: 3x3 pixel tiles at the gaze cell (27648 floats) plus 3
#     geometry floats; the gaze is the second action head (a cell index);
# 3 = agent view: 18 pixel tiles - a 3x3 window in which the player is the
#     bottom-center cell plus a 3x3 window at the gaze cell (55296 floats)
#     plus 3 geometry floats (55299 total); the gaze is the second action
#     head. Mode 3 learns with the shared tile CNN in the research build
#     (research/build_lanedodge_tilecnn.sh), the same architecture as
#     Sprite Forage's partial-pixel model; the standard binary runs mode 3
#     with the default MLP.
# Mode 1 keeps the shared Nature CNN on the full 640x480 map.
# 4 = one-hot state for exactly the same 18 cells and geometry as mode 3.
#     Use 4 versus 3 to compare state/pixels with matching visibility.
observation_mode = 0
# World RNG offset, added to the native environment slot. Never sweep seeds.
seed = 0
max_steps = 400
# Per-tick spawn percentages for hazards and coins. Re-tuned on the consume-once
# coin semantics: h1c40 is the closest-to-target rate that keeps hazards in
# play (see research/results/sprite-lanedodge-5060-20261016/results.md).
hazard_rate = 1
coin_rate = 40
step_cost = -0.001
# Reward scales can vary; perf is fixed: 0.5 * survival + 0.5 * coins collected.
reward_coin = 1.0
reward_death = -0.5
# 0 = original palette; 1 = swapped global palette; 2 = mirrored sprites.
representation = 0
# Headful full-map render only: 1 draws a Mode7-style 2.5D perspective view
# (sky horizon, compressed far rows, distance fog); the mode-2 ROI window and
# all observations/learning are unchanged.
mode7 = 0

[vec]
# State-tuned batch; full-resolution pixels need smaller batches (see README).
total_agents = 256
num_buffers = 1
num_threads = 4

[policy]
hidden_size = 128
num_layers = 1

[train]
gpus = 1
total_timesteps = 16777216
learning_rate = 0.0141914776
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.998099923
gae_lambda = 0.850000024
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.00611945381
anneal_ent_coef = 0
momentum = 0.95
horizon = 64
minibatch_size = 2048
vtrace = 0
verb_eps = 0.0

[sweep]
metric = perf

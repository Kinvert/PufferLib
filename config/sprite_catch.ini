[base]
env_name = sprite_catch
async = 0
[env]
# Same rules: 0 = six state floats, 1 = 640x480 RGB pixels.
observation_mode = 0
# Research attention build only: 1 = player 3x3 + chosen gaze 3x3.
# State uses one-hot tiles; pixels use the shared tile CNN. Same visible cells.
# Adds separate gaze X/Y actions; normal builds retain movement only.
partial_observation = 0
representation = 0
seed = 0
drops = 10
[vec]
total_agents = 8
num_buffers = 1
num_threads = 2
[policy]
hidden_size = 128
num_layers = 4
[train]
gpus = 1
total_timesteps = 2097152
learning_rate = 0.003
ent_coef = 0.03
anneal_ent_coef = 1
min_ent_coef_ratio = 0.001
gamma = 0.99
gae_lambda = 0.95
horizon = 8
minibatch_size = 8
[sweep]
metric = perf

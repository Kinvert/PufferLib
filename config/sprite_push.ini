[base]
env_name = sprite_push
async = 0
[env]
observation_mode = 0
# Research attention build only: 1 = player 3x3 + chosen gaze 3x3.
# State uses one-hot tiles; pixels use the shared tile CNN. Same visible cells.
# Adds separate gaze X/Y actions; normal builds retain movement only.
partial_observation = 0
representation = 0
seed = 0
max_steps = 128
[vec]
total_agents = 8
num_buffers = 1
num_threads = 2
[policy]
hidden_size = 128
num_layers = 1
[train]
gpus = 1
total_timesteps = 2097152
learning_rate = 0.003
ent_coef = 0.003
gamma = 0.99
gae_lambda = 0.95
horizon = 8
minibatch_size = 8
[sweep]
metric = perf

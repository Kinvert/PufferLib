[base]
env_name = dogfight

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
num_layers = 1
hidden_size = 128
action_init_scale = 0.01
value_init_scale = 1.0

[env]
num_agents = 1
max_steps = 300
obs_scheme = 0
curriculum_enabled = 1
curriculum_randomize = 0
reward_aim_scale = 0.001695
reward_closing_scale = 0.0001
penalty_neg_g = 0.035
control_rate_penalty = 0.002
low_altitude_threshold = 1200.0
low_altitude_penalty = 0.005
speed_min = 50.0
aim_decay_stage = 30.0
shaping_decay_start = 100_000_000
shaping_decay_end = 150_000_000
energy_gain_scale = 0.001
energy_loss_scale = 0.0005
energy_advantage_scale = 0.004
eval_spawn_mode = 0
recovery_enabled = 1
recovery_altitude_threshold = 500.0
recovery_trigger_prob = 0.067
recovery_speed_threshold = 70.0
recovery_bank_deg = 60.0
domain_randomization = 0.05
vertical_spawn_prob = 0.02
; Dogfight3 stage 9 uses the STAGES table bank directly: 30 degrees.
stage9_bank_deg = 30.0
; 0 disables the energy-building side variant; 1 forces it for diagnostics.
side_energy_spawn_prob = 0.2

[curriculum]
enabled = 1
initial_target = 0.9
max_target = 18.0
step = 1.0
promote_threshold = 0.90
min_episodes = 50
warmup_steps = 1_000_000
eval_interval = 60_000
window_decay = 0.9
stage9_bank_curriculum = 0
stage9_bank_start_target = 8.5
stage9_bank_full_target = 8.9
stage9_bank_step = 0.1

[sweep]
method = Protein
metric = curriculum_soft_quality
metric_distribution = linear
goal = maximize
downsample = 5

[train]
gpus = 1
seed = 42
total_timesteps = 400_000_000
learning_rate = 0.00045
minibatch_size = 65536
horizon = 64
gamma = 0.99
gae_lambda = 0.999
ent_coef = 0.0024
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
clip_coef = 0.11
vf_coef = 2.9
vf_clip_coef = 1.5
max_grad_norm = 1.8
anneal_lr = 1
min_lr_ratio = 0
momentum = 0.9896
eps = 1.49e-08
prio_alpha = 0.99
prio_beta0 = 0.99
vtrace_rho_clip = 2.79
vtrace_c_clip = 3.5
replay_ratio = 1.0

# Dogfight-local sweep centers. Full blocks keep the intent explicit and match
# the tuned-INI format used by other environments.
[sweep.train.total_timesteps]
distribution = uniform
min = 50_000_000
max = 100_000_000
mean = 50_000_000
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
mean = 128
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
mean = 2
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 4096
mean = 4096
scale = 0.25

[sweep.policy.action_init_scale]
distribution = log_normal
min = 0.003
max = 1.0
mean = 1.0
scale = 0.5

[sweep.vec.num_buffers]
distribution = int_uniform
min = 1
max = 8
mean = 3
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 256
mean = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 16384
mean = 4096
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00045
max = 0.02
mean = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.02
mean = 0.001
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
mean = 0.98
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.9999
mean = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
mean = 2.79
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
mean = 3.5
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 2.0
mean = 0.5
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.30
mean = 0.11
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
mean = 1.5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
mean = 2.9
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
mean = 1.8
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
mean = 0.9896
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
mean = 1.49e-08
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.99
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.99
scale = auto

[sweep.train.state_buffer_size]
distribution = int_uniform
min = 512
max = 20_000
mean = 8192
scale = auto

[sweep.train.cl_frac]
distribution = uniform
min = 0.05
max = 0.8
mean = 0.35
scale = auto

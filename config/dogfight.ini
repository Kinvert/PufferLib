# Python sweep honors sweep_only directly. Native 5c does not, so the
# Dogfight-local native launcher uses this allowlist when staging its isolated
# config. The separate puf_log contract is at most 31 values because core
# appends n as value 32.
sweep_only = env.native_spawn_total_steps, env.native_frontier_fraction, vec.frozen_bank_pct

[sweep.env.native_spawn_total_steps]
distribution = log_normal
min = 8_000_000_000
max = 12_079_595_520
scale = auto

[sweep.env.native_frontier_fraction]
distribution = uniform
min = 0.45
max = 0.80
scale = auto

[sweep.vec.frozen_bank_pct]
distribution = uniform
min = 0.05
max = 0.20
scale = auto

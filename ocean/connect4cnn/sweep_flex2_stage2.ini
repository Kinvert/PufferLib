# Encoder 5: bounded depth-two extension of the fixed 7x7/stride-4 stem.
# Stage two is capped at 32 channels and 3x3 kernels on <=9x11 pixels.
# Fixed 13.312M decisions per trial; the stem is fixed in advance.
[env]
representation = 0
representation_mode = 0
representation_seed = 0

[policy]
encoder = 5
cnn_depth = 2
cnn_projection = 32
cnn_readout = 2
cnn_projection_activation = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_dilation_1 = 1
cnn_activation_1 = 0
cnn_pool_1 = 0
cnn_residual_1 = 0
cnn_channels_2 = 16
cnn_kernel_2 = 3
cnn_stride_2 = 1
cnn_dilation_2 = 1
cnn_activation_2 = 0
cnn_pool_2 = 0
cnn_residual_2 = 0

[base]
checkpoint_interval = 500
seed = 73

[train]
total_timesteps = 13312000

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 64
gpus = 1
downsample = 25
max_suggestion_cost = 600

[sweep.policy.cnn_projection]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.policy.cnn_readout]
distribution = int_uniform
min = 0
max = 3
scale = auto

[sweep.policy.cnn_channels_2]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_kernel_2]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.policy.cnn_dilation_2]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.policy.cnn_activation_2]
distribution = int_uniform
min = 0
max = 4
scale = auto

[sweep.policy.cnn_pool_2]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_residual_2]
distribution = int_uniform
min = 0
max = 1
scale = auto

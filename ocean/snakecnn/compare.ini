# Common learner for the separately versioned Snake protocol; not tuned yet.
# Short preparation budgets test plumbing; calibrated learning remains a gate.
[base]
async = 0
cudagraphs = 1
checkpoint_interval = 16
eval_episodes = 0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2
num_policies = 1
hist_policy_percent = 0

[selfplay]
enabled = 0

[policy]
hidden_size = 128
num_layers = 1

[train]
gpus = 1
total_timesteps = 13312000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
momentum = 0.9
minibatch_size = 2048
horizon = 32
vtrace = 0
verb_eps = 0

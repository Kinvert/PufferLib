# Development candidate: stock Flappy learner/vector/actor settings only.
# The four CNN graphs and their common H128/L1 remain frozen by preparation.
# No game, observation, seed, decision-budget or checkpoint-cadence override.
# Unvalidated for Nature/IMPALA/Impoola at this batch: GPU memory/math gates stay.
[base]
async = 1
cudagraphs = 1
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[train]
learning_rate = 0.01
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.92
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.5
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.003
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 16384
horizon = 64
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

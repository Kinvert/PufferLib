# Common state/pixel canary recipe. Untuned; architecture/core and learner match.
[base]
async = 0
cudagraphs = 1
reset_every_horizon = 0
load_model_path = None
eval_episodes = 0
eval_agents = -1
seed = 39173
checkpoint_interval = 8

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2
num_policies = 1
hist_policy_percent = 0

[env]
representation = 0
representation_mode = 0
representation_seed = 0
width = 420
height = 640
max_steps = 4096
gravity = 0.45
flap_velocity = -7.5
pipe_speed = 3.0
pipe_gap = 190.0
pipe_width = 58.0
pipe_spacing = 220.0

# Dogfight-local overrides for the stock PufferLib 5c native Protein sweep.
#
# The launcher overlays this file onto config/dogfight.ini inside a preserved
# experiment directory. It does not modify PufferLib core configuration.

[base]
# 384 epochs * 4096 agents * horizon 64 = 100,663,296 agent steps.
# This matches selfplay.opp_timeout_steps closely enough to retain one new
# historical snapshot per opponent-rotation interval without producing 5,761
# checkpoints per full-length trial.
checkpoint_interval = 384

[fixed_eval]
# This section is recorded in the experiment manifest and removed before the
# staged INI is passed to PufferLib. Screening begins only after the native
# sweep process releases CUDA. Re-running --screen-existing resumes by
# checkpoint hash without retraining or repeating completed evaluations.
enabled = true
stages = 0..10
seeds = 42,314159,271828
mirrors = 0,1
episodes = 128
threshold = 0.90
timeout_seconds = 1800
max_attempts = 3

[env]
# Screening compresses the progressive spawn schedule into a run long enough
# to preserve the 134M-step acquisition school and then expose every spawn
# stage. Qualifying configurations are promoted to the full 12.08B-step INI.
native_spawn_total_steps = 671_088_640

[train]
# 2,560 native epochs at 4,096 agents and horizon 64. At the measured
# 1.9M-2.8M agent SPS this is approximately four to six minutes per trial.
total_timesteps = 671_088_640

[sweep]
max_runs = 1000
gpus = 1

[sweep.env.native_spawn_total_steps]
distribution = log_normal
min = 402_653_184
max = 805_306_368
scale = auto

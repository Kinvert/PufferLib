# Opt-in FORAGE_ATTENTION build. Starting smoke recipe, not learning-tuned.
[env]
# Same two switches also support full-state/full-pixel controls in this build.
partial_observation = 1
observation_mode = 1

[vec]
total_agents = 8
num_buffers = 1
num_threads = 2

[policy]
hidden_size = 128
num_layers = 1

[base]
seed = 7
checkpoint_interval = 0

[train]
gpus = 1
total_timesteps = 8192
learning_rate = 0.001
horizon = 8
minibatch_size = 8

# Realistic-image plumbing only. NOT calibrated learning or frontier evidence.
# Three native suggestions, six games/all41 drawings per suggestion. Fixed seeds.
[search]
image_contract = human-geometry-v1
learner_mode = per_game
max_runs = 3
steps = 64
checkpoint_steps = 64
training_seeds = 7
appearance_seed = 17
eval_seed = 7007
# One assigned episode per drawing proves the feedback cross product within the
# short allocation. Separate five-episode Maze graph/repeat/eager probe retains
# the multi-wave long-horizon check; this packet is not learning evidence.
episodes = 1
slots = 4
pong_max_decisions = 512
breakout_max_frames = 2048
campaign_timeout = 900
train_timeout = 30
eval_timeout = 60
proposal_timeout = 30
image_storage_limit_mib = 4096

[protein]
seed = 83
num_random_samples = 2
gp_training_iter = 50

[policy]
encoder = 4
hidden_size = 128
num_layers = 1
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 1
cnn_channels_1 = 8
cnn_kernel_1 = 8
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0

[sweep.policy.cnn_projection]
distribution = uniform_pow2
scale = auto
min = 16
max = 64

[objective.connect4cnn]
offset = 0
target = 1

[objective.pongcnn]
offset = 0
target = 1

[objective.flappycnn]
offset = 0
target = 1

[objective.breakoutcnn]
offset = 0
target = 1

[objective.snakecnn]
offset = 0
target = 1

[objective.mazecnn]
offset = 0
target = 1

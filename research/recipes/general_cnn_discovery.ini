# Architecture-only native PROTEIN discovery. Learner values come from each
# game's compare.ini; no LR/clip/core/appearance/timestep search dimensions.
# Proposals are single-game; validate EVERY candidate across games afterwards.
# Not authorization to launch; encoder 4's broad shapes need separate acceptance.
[env]
# Fixed appearance by default. --appearance-seed N explicitly opts into all
# current drawings, fixed per native slot; appearance is not a search dimension.
representation = 0

[policy]
encoder = 4
hidden_size = 128
num_layers = 1
cnn_depth = 1
cnn_projection = 32
cnn_global_pool = 0
cnn_channels_1 = 8
cnn_kernel_1 = 8
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0
cnn_channels_2 = 16
cnn_kernel_2 = 3
cnn_stride_2 = 2
cnn_pool_2 = 0
cnn_residual_2 = 0
cnn_channels_3 = 16
cnn_kernel_3 = 3
cnn_stride_3 = 1
cnn_pool_3 = 0
cnn_residual_3 = 0

[base]
checkpoint_interval = 128
seed = 73

[train]
total_timesteps = 13312000

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 128
gpus = 1
downsample = 25
max_suggestion_cost = 600

[sweep.policy.cnn_depth]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.policy.cnn_projection]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.policy.cnn_global_pool]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.policy.cnn_channels_1]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_kernel_1]
distribution = int_uniform
min = 1
max = 8
scale = auto

[sweep.policy.cnn_stride_1]
distribution = uniform_pow2
min = 4
max = 8
scale = auto

[sweep.policy.cnn_pool_1]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_residual_1]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.policy.cnn_channels_2]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_kernel_2]
distribution = int_uniform
min = 1
max = 5
scale = auto

[sweep.policy.cnn_stride_2]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.cnn_pool_2]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_residual_2]
distribution = int_uniform

# Targeted spatial-preserving control for the larger native frames.
# No learning/speed qualification yet. Learners/seeds/budgets come from the panel.
# Compared with GAP, this retains coarse location at a much smaller flatten head.
[policy]
encoder = 4
hidden_size = 128
num_layers = 1
cnn_depth = 1
cnn_projection = 16
cnn_global_pool = 0
cnn_channels_1 = 8
cnn_kernel_1 = 8
cnn_stride_1 = 8
cnn_pool_1 = 2
cnn_residual_1 = 0

[train]
horizon = 16

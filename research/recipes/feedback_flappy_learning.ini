# Stock Flappy scalar learner values with a declared smaller shared rollout.
# H128/L1, 64 actors, H64, M2048; not the earlier stock H64/L2 pilot.
[train]
horizon = 64
minibatch_size = 2048
learning_rate = 0.01
gamma = 0.995
gae_lambda = 0.92
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1.5
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.003
momentum = 0.95

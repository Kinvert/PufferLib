[autoencoder]
# Fixed pretraining seed, never a sweep coordinate.
seed = 7
batch = 2
steps = 1024
checkpoint_interval = 128
learning_rate = 0.0003
max_grad_norm = 1.0
# 0 = ordinary MSE. Positive values weight visible local RGB contrasts.
edge_weight = 0
# Optional pilot cap. Collection and training require explicit CLI commands.
max_seconds = 900

# State-Maze scalar learner values adapted to common H128/L1 and 64 actors.
# Long temporal context; effective replay is recorded by the native preflight.
[train]
horizon = 256
minibatch_size = 2048
learning_rate = 0.000755471
gamma = 0.993628
gae_lambda = 0.942137
replay_ratio = 2.85958
clip_coef = 0.1304
vf_coef = 3.03966
vf_clip_coef = 3.48152
max_grad_norm = 1.41109
ent_coef = 1e-05
momentum = 0.994379

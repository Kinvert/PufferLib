# Fixed tiny allocation to prove native multi-game PROTEIN feedback, not learning.
# These objective anchors are declared development choices, not calibrated claims.
[search]
max_runs = 3
steps = 65536
checkpoint_steps = 65536
training_seeds = 60173
appearance_seed = 35173
eval_seed = 70173
episodes = 17
slots = 16
pong_max_decisions = 512
breakout_max_frames = 2048
campaign_timeout = 600
train_timeout = 10
eval_timeout = 20
proposal_timeout = 30

[protein]
seed = 73
# Exercise the GP after the first actual panel; ordinary discovery defaults to10.
num_random_samples = 0
gp_training_iter = 50

[policy]
encoder = 4
hidden_size = 128
num_layers = 1
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0

[sweep.policy.cnn_channels_1]
distribution = uniform_pow2
min = 8
max = 16
scale = auto

# normalize = clip((exact_score - offset) / (target - offset), 0, 1)
# Average drawings/seeds inside each game, then weight all six games equally.
# Pong uses the conservative lower bound, retaining upper/censoring data too.
[objective.connect4cnn]
offset = 0
target = 1
[objective.pongcnn]
offset = 0
target = 1
[objective.flappycnn]
offset = 0
target = 100
[objective.breakoutcnn]
offset = 0
target = 20
[objective.snakecnn]
offset = 1
target = 20
[objective.mazecnn]
offset = 0
target = 1

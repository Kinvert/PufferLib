[experiment]
# Explicit run only. These are diagnostic pilots, not an RL/Pareto sweep.
max_seconds = 3600

[data]
train_worlds = 16
validation_worlds = 4
test_worlds = 8
train_skins = 0,1,2
validation_skins = 0,1,2
test_skins = 0,1,2,3,4
frames_per_episode = 4
max_steps = 32
cadence = 4
max_gib = 2

[autoencoder]
# Both recipes share all settings; the supervisor sets loss_mode to 0 or 1.
seed = 7
batch = 2
steps = 1024
checkpoint_interval = 128
learning_rate = 0.0003
max_grad_norm = 1.0
edge_weight = 0
loss_mode = 0
object_weight = 1.0
background_weight = 0.1
max_seconds = 900

[probe]
# Same full-frame 128-value latent, same 300x13 linear readout in every case.
batch = 16
steps = 512
learning_rate = 0.003
max_seconds = 300

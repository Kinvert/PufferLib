# Temporary native PROTEIN grammar. Only these 18 CNN coordinates vary.
# The preparation tool removes inherited sweep sections before merging this.
# Training seed, learner, core, observations and actions are NOT search axes.
[policy]
encoder = 4
cnn_depth = 1
cnn_projection = 32
cnn_global_pool = 0
cnn_channels_1 = 8
cnn_kernel_1 = 8
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0
cnn_channels_2 = 16
cnn_kernel_2 = 3
cnn_stride_2 = 2
cnn_pool_2 = 0
cnn_residual_2 = 0
cnn_channels_3 = 16
cnn_kernel_3 = 3
cnn_stride_3 = 1
cnn_pool_3 = 0
cnn_residual_3 = 0

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 32
gpus = 1
downsample = 8
max_suggestion_cost = 600

[sweep.policy.cnn_depth]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.policy.cnn_projection]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.policy.cnn_global_pool]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.policy.cnn_channels_1]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_kernel_1]
distribution = int_uniform
min = 1
max = 8
scale = auto

[sweep.policy.cnn_stride_1]
distribution = uniform_pow2
min = 4
max = 8
scale = auto

[sweep.policy.cnn_pool_1]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_residual_1]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.policy.cnn_channels_2]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_kernel_2]

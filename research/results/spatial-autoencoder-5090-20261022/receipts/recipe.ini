[experiment]
# Fixed comparison grid initially; resulting artifact bank supports native PROTEIN.
variants = 8:8,16:8,16:16,32:16
max_seconds = 14400

[data]
train_worlds = 16
validation_worlds = 4
test_worlds = 8
train_skins = 0,1,2
validation_skins = 0,1,2
test_skins = 0,1,2,3,4
frames_per_episode = 4
max_steps = 32
cadence = 4
max_gib = 2

[autoencoder]
# All sizes and plain/object-loss controls get this same recipe/data/init seed.
# The native supervisor sets latent_stride and latent_channels per candidate.
seed = 7
batch = 2
steps = 1024
checkpoint_interval = 128
learning_rate = 0.0003
max_grad_norm = 1.0
edge_weight = 0
loss_mode = 1
object_weight = 1.0
background_weight = 0.1
max_seconds = 900

[probe]
# Retained only for compatibility with the shared bounded collection validator.
# Spatial campaigns DO NOT fit a classification head.
batch = 1
steps = 1
learning_rate = 0.003
max_seconds = 60

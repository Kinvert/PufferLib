# Cheap initial candidate; expose depth, width, early stride, and projection.
[policy]
encoder = 3
cnn_channels = 8
cnn_depth = 1
cnn_stride = 4
cnn_projection = 32

[base]
checkpoint_interval = 500
seed = 73

[train]
total_timesteps = 3319808

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 24
gpus = 1
downsample = 25
max_suggestion_cost = 300

[sweep.policy.cnn_channels]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_depth]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.policy.cnn_stride]
distribution = uniform_pow2
min = 2
max = 4
scale = auto

[sweep.policy.cnn_projection]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 829952
max = 6639616
scale = time

# Native Breakout rules/geometry; direct grayscale observations, no Raylib rendering.
# Untuned shared quality encoder. This is a starting config, not a benchmark claim.
[base]
env_name = breakoutcnn
async = 0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2

[policy]
encoder = 4
hidden_size = 128
num_layers = 1
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0

[env]
num_agents = 1
representation = 0
representation_mode = 0
representation_seed = 0
frameskip = 3
width = 576
height = 330
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 0

[train]
total_timesteps = 13_312_000
learning_rate = 0.001
minibatch_size = 2048
horizon = 32

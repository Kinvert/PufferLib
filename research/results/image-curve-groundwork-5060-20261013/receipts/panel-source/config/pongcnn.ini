[base]
env_name = pongcnn

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 16

[env]
representation = 0
representation_mode = 0
representation_seed = 0
representation_mix_catalog = 0
width = 500
height = 640
paddle_width = 20
paddle_height = 70
ball_width = 32
ball_height = 32
paddle_speed = 8
ball_initial_speed_x = 10
ball_initial_speed_y = 1
ball_speed_y_increment = 3
ball_max_speed_y = 13
max_score = 21
frameskip = 8
continuous = 0

[policy]
# Reuses the existing flexible CNN; stock Pong learner/core settings below
# are only starting settings. Use ocean/pongcnn/compare.ini for matched tests.
encoder = 4
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0
hidden_size = 64
num_layers = 3

[train]
total_timesteps = 8000000
learning_rate = 0.1
gamma = 0.98529
gae_lambda = 0.995
replay_ratio = 4
clip_coef = 0.538
vf_coef = 5
vf_clip_coef = 4.38
max_grad_norm = 0.1
ent_coef = 3.85e-05
momentum = 0.5
minibatch_size = 16384
horizon = 64

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 5e7
scale = auto

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
scale = 2.0

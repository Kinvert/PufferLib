# Expanded native family, encoder 5. Discovery only; no quality claims from canaries.
# Default depth is fixed. --depth 1/2/3/4 removes inactive sweep dimensions.
# Delete any sweep section to fix that control. Keep policy keys for reload.
[env]
representation = 0
representation_mode = 0
representation_seed = 0

[policy]
encoder = 5
cnn_depth = 2
cnn_projection = 32
cnn_readout = 2
cnn_projection_activation = 0
cnn_channels_1 = 8
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_dilation_1 = 1
cnn_activation_1 = 0
cnn_pool_1 = 0
cnn_residual_1 = 0
cnn_channels_2 = 16
cnn_kernel_2 = 3
cnn_stride_2 = 1
cnn_dilation_2 = 1
cnn_activation_2 = 0
cnn_pool_2 = 0
cnn_residual_2 = 0
cnn_channels_3 = 16
cnn_kernel_3 = 3
cnn_stride_3 = 1
cnn_dilation_3 = 1
cnn_activation_3 = 0
cnn_pool_3 = 0
cnn_residual_3 = 0
cnn_channels_4 = 16
cnn_kernel_4 = 3
cnn_stride_4 = 1
cnn_dilation_4 = 1
cnn_activation_4 = 0
cnn_pool_4 = 0
cnn_residual_4 = 0

[base]
checkpoint_interval = 500
seed = 73

[train]
total_timesteps = 13312000

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 12
gpus = 1
downsample = 25
max_suggestion_cost = 600

[sweep.policy.cnn_projection]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.policy.cnn_readout]
distribution = int_uniform
min = 0
max = 3
scale = auto


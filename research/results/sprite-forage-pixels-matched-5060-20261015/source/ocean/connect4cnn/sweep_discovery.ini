# First learning-scale search: same family and learner as the canary.
[policy]
encoder = 1
cnn_channels = 8
cnn_blocks = 0
cnn_global_pool = 0

[base]
checkpoint_interval = 1000
seed = 73

[train]
total_timesteps = 6639616

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 24
gpus = 1
downsample = 5
max_suggestion_cost = 3600

[sweep.policy.cnn_channels]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_blocks]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_global_pool]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 3319808
max = 13279232
scale = time

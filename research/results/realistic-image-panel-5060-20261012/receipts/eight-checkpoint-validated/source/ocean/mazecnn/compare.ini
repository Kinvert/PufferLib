# Matched plumbing recipe, not calibrated for learning. Use unchanged for every CNN.
[base]
async = 0
cudagraphs = 1
reset_every_horizon = 0
load_model_path = None
eval_episodes = 0
eval_agents = -1
seed = 39173
checkpoint_interval = 8

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2
num_policies = 1
hist_policy_percent = 0

[selfplay]
enabled = 0

[policy]
hidden_size = 128
num_layers = 1
encoder = 4
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0

[train]
gpus = 1
total_timesteps = 65536
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.001
anneal_ent_coef = 0
momentum = 0.95
minibatch_size = 2048
horizon = 32
vtrace = 0

[sweep]
metric = perf
downsample = 25

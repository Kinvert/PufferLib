# Small canary: enough trials to get beyond PROTEIN's initial suggestions.
# The runner overlays compare.ini and retains ONLY these sweep sections.
[policy]
encoder = 1
cnn_channels = 8
cnn_blocks = 0
cnn_global_pool = 0

[base]
checkpoint_interval = 16
seed = 73

[train]
total_timesteps = 32768

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 12
gpus = 1
downsample = 5
max_suggestion_cost = 60

[sweep.policy.cnn_channels]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.policy.cnn_blocks]
distribution = int_uniform
min = 0
max = 2
scale = auto

[sweep.policy.cnn_global_pool]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 16384
max = 65536
scale = time

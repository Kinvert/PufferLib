# Development candidate: same stock Flappy learner/vector/actor settings,
# except minibatch_size=2048, applied equally to all four frozen CNNs.
# Smaller registered buffers do not certify total VRAM fit or learning.
[base]
async = 1
cudagraphs = 1
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[train]
learning_rate = 0.01
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.92
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.5
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.003
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 2048
horizon = 64
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

# Fixed Nature architecture; PROTEIN sweeps training budget only.
[policy]
encoder = 2

[base]
checkpoint_interval = 500
seed = 73

[train]
total_timesteps = 3319808

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 12
gpus = 1
downsample = 25
max_suggestion_cost = 300

[sweep.train.total_timesteps]
distribution = log_normal
min = 829952
max = 6639616
scale = time

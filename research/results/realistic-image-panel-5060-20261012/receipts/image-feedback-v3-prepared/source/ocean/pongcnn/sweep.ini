# Development search. Every encoder and the recurrent core stay fixed.
# The same training search space is used for all four pixel encoder families.
[base]
seed = 9173
checkpoint_interval = 500

[train]
total_timesteps = 13312000

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 24
gpus = 1
downsample = 25
max_suggestion_cost = 3600

[sweep.train.total_timesteps]
distribution = log_normal
min = 2097152
max = 13312000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 4
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

# Untuned common recipe: original state Pong and every pixel encoder receive this.
# This is a plumbing baseline, not stock Pong's tuned learner configuration.
[base]
async = 0
cudagraphs = 1
reset_every_horizon = 0
load_model_path = None
eval_episodes = 0
eval_agents = -1
seed = 9173
checkpoint_interval = 8

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2
num_policies = 1
hist_policy_percent = 0

[env]
width = 500
height = 640
paddle_width = 20
paddle_height = 70
ball_width = 32
ball_height = 32
paddle_speed = 8
ball_initial_speed_x = 10
ball_initial_speed_y = 1
ball_speed_y_increment = 3
ball_max_speed_y = 13
max_score = 21
frameskip = 8
continuous = 0

[selfplay]
enabled = 0

[policy]
hidden_size = 128
num_layers = 1
encoder = 4
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0

[train]
gpus = 1
total_timesteps = 65536
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98529
gae_lambda = 0.995
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.001
anneal_ent_coef = 0
momentum = 0.5
minibatch_size = 2048
horizon = 32
vtrace = 0

[sweep]
metric = score
downsample = 25

# Common recipe for state and pixel policies. A starting recipe, not a sweep.
# The runner passes these values to BOTH native binaries as CLI overrides.
[base]
async = 0
cudagraphs = 1
reset_every_horizon = 0
load_model_path = None
eval_episodes = 0
eval_agents = -1

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2
num_policies = 1
hist_policy_percent = 0

[env]
representation = 0
representation_mode = 0
representation_seed = 0
num_agents = 1
player_pieces = 0
env_pieces = 0

[selfplay]
enabled = 0

[policy]
hidden_size = 128
num_layers = 1

[train]
gpus = 1
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.8
gae_lambda = 0.962627
replay_ratio = 1
clip_coef = 0.511829
vf_coef = 5
vf_clip_coef = 1.99178
max_grad_norm = 0.552251
ent_coef = 3.24222e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0
momentum = 0.878636
minibatch_size = 2048
horizon = 32
vtrace = 0
vtrace_rho_clip = 1
vtrace_c_clip = 1
verb_eps = 0

[sweep]
metric = score

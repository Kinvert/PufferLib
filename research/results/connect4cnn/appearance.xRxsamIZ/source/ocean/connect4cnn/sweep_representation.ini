# Fixed existing CNN and learning budget; PROTEIN varies only the representation.
# Add this sweep section to sweep_flex.ini to search both appearance and shape.
[env]
representation = 0

[policy]
encoder = 4
cnn_depth = 1
cnn_projection = 64
cnn_global_pool = 0
cnn_channels_1 = 16
cnn_kernel_1 = 7
cnn_stride_1 = 4
cnn_pool_1 = 0
cnn_residual_1 = 0
cnn_channels_2 = 16
cnn_kernel_2 = 3
cnn_stride_2 = 2
cnn_pool_2 = 0
cnn_residual_2 = 0
cnn_channels_3 = 16
cnn_kernel_3 = 3
cnn_stride_3 = 1
cnn_pool_3 = 0
cnn_residual_3 = 0

[train]
total_timesteps = 13312000

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 20
gpus = 1
downsample = 25
max_suggestion_cost = 600

[sweep.env.representation]
distribution = int_uniform
min = 0
max = 9
scale = auto
